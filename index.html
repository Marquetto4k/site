<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Carteirinha UNIP</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #ffffff;
      padding: 20px;
      color: #000080;
    }
    .logo {
      text-align: center;
      margin-bottom: 10px;
      font-size: 40px;
      font-weight: bold;
      color: #FFD700; /* Amarelo */
      text-transform: uppercase; /* Deixa o texto em maiúsculas */
    }
    .title {
      text-align: center;
      font-weight: bold;
      margin-bottom: 20px;
    }
    .info {
      max-width: 600px;
      margin: 0 auto;
      border-top: 1px solid #000080;
      border-bottom: 1px solid #000080;
      padding: 15px 0;
    }
    .info p {
      margin: 8px 0;
      font-size: 16px;
    }
    .label {
      font-weight: bold;
    }
    .footer {
      text-align: left;
      font-size: 12px;
      margin-top: 15px;
      color: #444;
    }
  </style>
</head>
<body>
  <div class="logo">
    UNIP
  </div>
  <div class="title">Dados do Aluno</div>
  <div class="info">
    <p><span class="label">Matrícula:</span> 2449545</p>
    <p><span class="label">Nome:</span> IGOR MARQUETTO DA COSTA</p>
    <p><span class="label">RG:</span> 598344780</p>
    <p><span class="label">Nascimento:</span> 25/01/2001</p>
    <p><span class="label">Curso:</span> 57501 - SUP TEC EM ANÁLISE E DESENVOLVIMENTO DE SISTEMAS</p>
    <p><span class="label">Unidade:</span> 4003 - BAURU - POLO PRÓRIO</p>
    <p><span class="label">Carteirinha:</span> ATIVA</p>
    <p><span class="label">Validade:</span> 04/01/2026</p>
  </div>
  <div class="footer">Data: 02/05/2025</div>
</body>
</html>
